name: Android checks
on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CI startup guards
        run: bash ./tools/Test-CiStartup.sh
      - name: Check adb argument binding without a device
        shell: pwsh
        run: ./tools/Test-AdbArgumentBinding.ps1
      - name: Check connection smoke synchronization without a device
        shell: pwsh
        run: ./tools/Test-ConnectionSmoke.ps1
      - name: Check release diagnostic parsing without a device
        shell: pwsh
        run: ./tools/Test-ReleaseRuntimeParsing.ps1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build, test and lint
        run: bash ./gradlew checkKotlinStyle checkArchitecture :core:test :format:test :data:testDebugUnitTest :data:assembleDebugAndroidTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:lintRelease :app:assembleRelease :app:bundleRelease exportRuntimeDependencies -Pwhiteboard.leakDetection=false --max-workers=2 --no-parallel --console=plain
      - name: Audit resolved runtime dependencies
        shell: pwsh
        run: ./tools/Test-DependencySecurity.ps1
      - name: Verify runtime license notices
        shell: pwsh
        run: |
          ./tools/Get-DependencyLicenses.ps1 -FetchMissing
          ./tools/Build-LicenseNotices.ps1 -Verify
      - name: Inspect release APK policy
        shell: pwsh
        run: ./tools/Test-ReleaseSecurity.ps1 -ApkPath app/build/outputs/apk/release/app-release-unsigned.apk -Aapt2Path "$env:ANDROID_HOME/build-tools/36.0.0/aapt2"
      - name: Install checksummed secret scanner
        shell: bash
        run: |
          mkdir -p artifacts/security/scanner
          cd artifacts/security/scanner
          curl --fail --location --retry 2 -o scanner.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --location --retry 2 -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          mv scanner.tar.gz gitleaks_8.30.1_linux_x64.tar.gz
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
      - name: Scan current source files for secrets
        shell: pwsh
        run: ./tools/Test-SourceSecrets.ps1 -GitleaksPath "$PWD/artifacts/security/scanner/gitleaks"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            artifacts/security/*.json
            artifacts/security/*.tsv
  device-tests:
    name: device-tests (${{ matrix.api }}, ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # Read the pinned, previously qualified binary for install -r upgrade tests.
    strategy:
      fail-fast: false
      # Focus fixes first; the identical commit on a candidate branch runs all five profiles.
      matrix: ${{ fromJSON(startsWith(github.ref, 'refs/heads/codex/release-readiness') && '{"include":[{"api":26,"profile":"pixel_2"},{"api":30,"profile":"pixel_2"},{"api":33,"profile":"pixel_2"}]}' || '{"include":[{"api":26,"profile":"pixel_2"},{"api":30,"profile":"pixel_2"},{"api":33,"profile":"pixel_2"},{"api":36,"profile":"pixel_2"},{"api":26,"profile":"pixel_c"}]}') }}
    env:
      WHITEBOARD_CI_PROFILE: ${{ matrix.profile }}
      WHITEBOARD_CI_TEST_SCOPE: ${{ startsWith(github.ref, 'refs/heads/codex/release-readiness') && 'mind-map' || 'full' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install build SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Prepare packages before booting emulator
        run: |
          bash ./gradlew :data:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease -Pwhiteboard.leakDetection=false -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --no-parallel --console=plain
      - name: Boot, qualify and test the CI emulator
        run: bash ./tools/Run-CiEmulator.sh '${{ matrix.api }}' '${{ matrix.profile }}'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-device-reports-api-${{ matrix.api }}-${{ matrix.profile }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/outputs/connected_android_test_additional_output/
            artifacts/device-failures/
            artifacts/device-profile.txt
            artifacts/device-boot-anr.txt
            artifacts/device-release/
            artifacts/ci-*.log
            artifacts/ci-*.txt
            artifacts/*.png
            artifacts/smoke-ui.xml
